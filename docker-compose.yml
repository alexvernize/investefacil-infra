# Orquestração local do ecossistema investefacil.
# Contextos de build apontam para os repos irmãos (../investefacil e ../investefacil-front).
# Para produção, usar as imagens publicadas no Artifact Registry em vez de build local.

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: investefacil-db
    restart: unless-stopped
    # Hardening: impede escalonamento de privilégios. Caps padrão mantidos —
    # o entrypoint do postgres usa chown/gosu na primeira inicialização.
    security_opt:
      - no-new-privileges:true
    # Limites válidos no Compose standalone (deploy.resources só vale em Swarm).
    mem_limit: 256m
    cpus: 0.50
    environment:
      POSTGRES_DB:       investefacil
      POSTGRES_USER:     investefacil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # pg_data: volume nomeado — persiste entre `docker compose down` / `up`.
      # Destruir explicitamente com `docker volume rm` apenas em reset de schema.
      - pg_data:/var/lib/postgresql/data
      # Scripts em docker-entrypoint-initdb.d rodam apenas na primeira inicialização
      # do volume (diretório de dados vazio). Execução por ordem alfabética.
      - ../investefacil/scripts/migrations:/docker-entrypoint-initdb.d:ro
    # Exposto apenas em loopback para ferramentas locais (TablePlus, psql).
    # Em produção (Cloud Run + Cloud SQL), remover ports e usar socket Unix via sidecar.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investefacil -d investefacil"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_bridge
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"

  # ── Backend Go ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../investefacil
      dockerfile: Dockerfile
    container_name: investefacil-api
    restart: unless-stopped
    # Hardening: binário Go estático e não-root, sem necessidade de capabilities
    # nem de escrever em disco. FS raiz somente leitura; /tmp em tmpfs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.50
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend-net
      - internal_bridge
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "128M"

  # ── Frontend Next.js ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../investefacil-front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    container_name: investefacil-front
    restart: unless-stopped
    # Hardening: Node não-root, sem capabilities. Sem read_only (o runtime do
    # Next pode escrever cache em disco); /tmp isolado em tmpfs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.00
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: "production"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "512M"

volumes:
  pg_data:
    # Driver padrão (local) — troca por driver GCP Persistent Disk em produção.

# internal_bridge: rede isolada postgres ↔ backend.
#   internal: true bloqueia saída para internet — postgres não precisa de conectividade externa.
# backend-net: backend ↔ frontend. Não é internal (backend acessa API do BCB).
# frontend-net: isolamento do frontend.
# Isolamento de host via bind 127.0.0.1 em todas as portas expostas.
networks:
  frontend-net:
  backend-net:
  internal_bridge:
    internal: true
